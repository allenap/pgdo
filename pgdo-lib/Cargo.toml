[package]
authors.workspace = true
categories.workspace = true
description = "The convenience of SQLite – but with PostgreSQL (Library package)"
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "pgdo-lib"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "pgdo"
path = "src/lib.rs"

[dependencies]
backoff = "0.4.0"
bytes = "1.12"
either = "1.19.0"
fallible-iterator = "0.2"
glob = "0.3.4"
globset = "0.4.21"
log = "0.4.35"
nix = { version = "0.31.3", features = ["fs", "hostname", "signal", "user"] }
postgres-protocol = "0.6.12"
rand = "0.10.3"
regex = "1.13.1"
shell-quote = "0.7.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
pastey = "0.2.3"
pgdo-test = { path = "../pgdo-test" }
postgres = "0.19.14"
tempfile = "3"

[dev-dependencies.tokio]
version = "1.54.1"
features = ["rt"]
default-features = false
